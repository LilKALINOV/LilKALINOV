<text x="432.0" y="209.0" font-size="9.5" fill="#8d8b85" font-weight="600" text-anchor="middle" letter-spacing="1.6" class="mono">DDG RADAR</text></g><rect x="28" y="66" width="484" height="170" fill="none" stroke="#2d2c29"/><text x="512.0" y="254.0" font-size="10" fill="#8d8b85" font-weight="600" text-anchor="end" letter-spacing="1.6" class="mono">FIG. 07</text><clipPath id="ttl"><rect x="24" y="256" width="420" height="42"/></clipPath><g clip-path="url(#ttl)"><g class="reveal" style="animation-delay:0.15s"><text x="28.0" y="288.0" font-size="32" fill="#ecebe5" font-weight="800" letter-spacing="-0.96">Astra WebSearch DDG</text></g></g><g class="rise" style="animation-delay:0.35s"><text x="28.0" y="316.0" font-size="15" fill="#8d8b85">Поиск в реальном времени через DuckDuckGo:</text></g><g class="rise" style="animation-delay:0.45s"><text x="28.0" y="338.0" font-size="15" fill="#8d8b85">быстрые ответы из веба для Astra без лимитов и ключей.</text></g><path d="M28 342H512" stroke="#2d2c29"/><g class="fade" style="animation-delay:0.60s"><text x="28.0" y="366.0" font-size="12" fill="#8d8b85" class="mono">Rust</text><text x="66.8" y="366.0" font-size="12" fill="#ff5b14" class="mono">/</text><text x="84.0" y="366.0" font-size="12" fill="#8d8b85" class="mono">DuckDuckGo</text><text x="166.0" y="366.0" font-size="12" fill="#ff5b14" class="mono">/</text><text x="183.2" y="366.0" font-size="12" fill="#8d8b85" class="mono">Real-time</text><text x="258.0" y="366.0" font-size="12" fill="#ff5b14" class="mono">/</text><text x="275.2" y="366.0" font-size="12" fill="#8d8b85" class="mono">Web API</text></g>
