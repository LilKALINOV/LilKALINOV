<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="540" height="392" viewBox="0 0 540 392" role="img" aria-labelledby="t">
<title id="t">Astra WebSearch DDG — поиск в реальном времени через DuckDuckGo для Astra. Открыть репозиторий.</title>
<defs>
 <clipPath id="clip"><rect width="540" height="392" rx="6"/></clipPath>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 .5H2M.5 0V2" stroke="#ecebe5" stroke-opacity=".14"/></pattern>
 
