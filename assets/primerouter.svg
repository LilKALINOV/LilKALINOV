<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="title">
<title id="title">PrimeRouter &amp; CLI: Маршрутизация LLM-провайдеров и собственный CLI.</title>
<defs>
 <linearGradient id="panel" x1="0" y1="0" x2="0.35" y2="1">
  <stop stop-color="#141c2b"/><stop offset="1" stop-color="#0a0f19"/>
 </linearGradient>
 <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="196" y1="182" x2="600" y2="262">
  <stop stop-color="#ff6a3d"/><stop offset=".55" stop-color="#ff9f6e"/><stop offset="1" stop-color="#ffcab0"/>
 </linearGradient>
 <linearGradient id="brandx" x1="0" y1="0" x2="1" y2="0">
  <stop stop-color="#ff6a3d"/><stop offset="1" stop-color="#ff9f6e"/>
 </linearGradient>
 <linearGradient id="topline" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1060" y2="0">
  <stop stop-color="#ff6a3d" stop-opacity="0"/><stop offset=".5" stop-color="#ff9f6e" stop-opacity=".85"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
 </linearGradient>
 <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
  <stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
 </linearGradient>
 <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="softer" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
 </filter>
 <clipPath id="frame"><rect x=".5" y=".5" width="1099" height="219" rx="18"/></clipPath>
 <clipPath id="spc"><rect x="26" y="66" width="4" height="122" rx="2.0"/></clipPath>
 <linearGradient id="spineg" gradientUnits="userSpaceOnUse" x1="26" y1="66" x2="26" y2="188"><stop stop-color="#ff9f6e"/><stop offset=".5" stop-color="#ff6a3d"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
 <radialGradient id="au-03"><stop stop-color="#00c8b8" stop-opacity="0.11"/><stop offset=".55" stop-color="#00c8b8" stop-opacity="0.038"/><stop offset="1" stop-color="#00c8b8" stop-opacity="0"/></radialGradient>
</defs>
<style>
 text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
 .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,ui-monospace,'Courier New',monospace}
 /* 1. aurora blobs drifting on independent cycles */
 .drift-a{transform-box:fill-box;transform-origin:50% 50%;animation:drift-a 24s ease-in-out infinite}
 .drift-b{transform-box:fill-box;transform-origin:50% 50%;animation:drift-b 31s ease-in-out infinite}
 .drift-c{transform-box:fill-box;transform-origin:50% 50%;animation:drift-c 19s ease-in-out infinite}
 /* 2. orbital rings */
 .spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 26s linear infinite}
 .spin-rev{transform-box:fill-box;transform-origin:50% 50%;animation:spin 38s linear infinite reverse}
 /* 3. light running along a stroke */
 .dash{stroke-dasharray:10 26;animation:dash 3.6s linear infinite}
 .flow{stroke-dasharray:5 44;animation:flow 2.45s linear infinite}
 .ghostflow{stroke-dasharray:46 600;animation:ghostflow 7s linear infinite}
 /* 4. sheen sweeping the wordmark */
 .sweep{animation:sweep 7s linear infinite}
 /* 5. voice ripples leaving the core */
 .ripple{transform-box:fill-box;transform-origin:50% 50%;animation:ripple 3.6s cubic-bezier(.2,.6,.3,1) infinite}
 /* 6. equaliser bars */
 .eq{transform-box:fill-box;animation:eq 1.15s ease-in-out infinite alternate}
 .up{transform-origin:50% 100%}
 .dn{transform-origin:50% 0%}
 /* 7. light pulses riding the left accent spine */
 .spimp{animation:spimp 5.2s linear infinite}
 /* 8. status dot */
 .blink{animation:blink 2.4s ease-in-out infinite}
 .pulse{animation:pulse 4.5s ease-in-out infinite}
 /* 9. staggered entrance */
 .enter{animation:enter .62s cubic-bezier(.34,1.42,.52,1) both}
 .enter-soft{animation:enter-soft .8s cubic-bezier(.34,1.42,.52,1) both}
 /* 10. true mesh blending - screen adds light where two washes overlap, which is
     what a mesh gradient actually is; plain alpha just stacks grey. The frame
     group is isolation:isolate so the blend can never reach the page behind. */
 .mesh{mix-blend-mode:screen}
 /* 11. light travelling the frame edge, distance supplied per asset as --edge */
 .edgeflow{stroke-linecap:round;animation:edgeflow 9s linear infinite}
 /* 12. the core ring breathing between a circle and a squircle; `d` needs both
     paths to carry the same commands, and `from` is the plain circle so a
     renderer without CSS `d` shows exactly the current design */
 .morph{animation:morph 9.5s cubic-bezier(.45,0,.55,1) infinite alternate}
 /* 13. the wordmark settling from open tracking into its final fit. The masked
     copy inside #nm carries the same class, or the sheen would drift off the
     letters while the tracking changes under it. */
 .settle{animation:settle 1.6s cubic-bezier(.22,.68,.32,1) both}
 /* 14. a packet riding a path. Drawn as a 0.1-long round-capped dash on the very
     path it travels, so the dot is always exactly on the line and needs no
     offset-path; at rest it sits at the path's start, which is the right place
     for a renderer that never ticks the clock. --len is the measured path
     length, supplied per element, so one keyframe serves every route. */
 .packet{fill:none;stroke-linecap:round;animation:packet 3.6s linear infinite}
 /* 15. a second grain plate drifting against the first, so the texture lives */
 .grainx{animation:grainx 26s steps(9) infinite}
 .drift-d{transform-box:fill-box;transform-origin:50% 50%;animation:drift-d 27s ease-in-out infinite}
 @keyframes drift-a{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(34px,-24px) scale(1.12)}}
 @keyframes drift-b{0%,100%{transform:translate(0,0) scale(1.06)}50%{transform:translate(-42px,20px) scale(.94)}}
 @keyframes drift-c{0%,100%{transform:translate(0,0) scale(.96)}50%{transform:translate(24px,30px) scale(1.1)}}
 @keyframes drift-d{0%,100%{transform:translate(0,0) scale(1.04)}50%{transform:translate(-30px,26px) scale(.92)}}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes dash{to{stroke-dashoffset:-360}}
 @keyframes flow{to{stroke-dashoffset:-490}}
 @keyframes ghostflow{to{stroke-dashoffset:-646}}
 @keyframes sweep{0%{transform:translateX(-230px)}58%{transform:translateX(840px)}100%{transform:translateX(840px)}}
 @keyframes ripple{0%{transform:scale(.5);opacity:.6}70%{opacity:.1}100%{transform:scale(1.85);opacity:0}}
 @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
 @keyframes spimp{from{transform:translateY(-40px)}to{transform:translateY(calc(var(--spine-h) + 6px))}}
 @keyframes twinkle{0%,100%{opacity:.15;scale:.6}50%{opacity:.9;scale:1.25}}
 @keyframes drift-t{from{translate:0 0}to{translate:0 6px}}
 .twinkle{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 4.2s ease-in-out infinite,drift-t 9s ease-in-out infinite alternate}
 @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
 @keyframes pulse{0%,100%{opacity:.3}50%{opacity:.9}}
 @keyframes edgeflow{to{stroke-dashoffset:calc(-1 * var(--edge))}}
 @keyframes grainx{0%{transform:translate(0,0)}100%{transform:translate(-140px,90px)}}
 @keyframes enter{from{opacity:.62;transform:translateY(10px)}to{opacity:1;transform:none}}
 @keyframes enter-soft{from{opacity:.8;transform:translateY(9px)}to{opacity:1;transform:none}}
 @keyframes gwsweep{from{transform:translateX(-420px)}to{transform:translateX(1520px)}}
 .gws{animation:gwsweep 8.5s cubic-bezier(.45,0,.55,1) infinite}
 @keyframes btsweep{0%{transform:translateX(-140px)}60%{transform:translateX(150px)}100%{transform:translateX(150px)}}
 .btsweep{animation:btsweep 5.2s cubic-bezier(.45,0,.55,1) infinite}
 @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transform:none!important;scale:1!important;translate:0 0!important}}
 @keyframes morph{from{d:path('M926 236C926 268.033 900.033 294 868 294C835.967 294 810 268.033 810 236C810 203.967 835.967 178 868 178C900.033 178 926 203.967 926 236Z')}to{d:path('M926 236C926 294 926 294 868 294C810 294 810 294 810 236C810 178 810 178 868 178C926 178 926 178 926 236Z')}} @keyframes settle{from{letter-spacing:-1.4px}to{letter-spacing:-6px}} @keyframes packet{from{stroke-dashoffset:0}to{stroke-dashoffset:calc(-1 * var(--len))}}</style>
<g clip-path="url(#frame)" style="isolation:isolate">
<rect x=".5" y=".5" width="1099" height="219" rx="18" fill="url(#panel)"/>
<g opacity=".5"><circle class="twinkle" cx="40" cy="12.1" r="1.6" fill="#ffcab0" style="animation-delay:-4.2s"/><circle class="twinkle" cx="210" cy="12.8" r="1.1" fill="#ffcab0" style="animation-delay:-1.13s"/><circle class="twinkle" cx="380" cy="12.4" r="1.1" fill="#ffcab0" style="animation-delay:-2.26s"/><circle class="twinkle" cx="550" cy="12" r="1.6" fill="#ffcab0" style="animation-delay:-3.39s"/><circle class="twinkle" cx="720" cy="12.7" r="1.1" fill="#ffcab0" style="animation-delay:-0.32s"/><circle class="twinkle" cx="890" cy="12.3" r="1.1" fill="#ffcab0" style="animation-delay:-1.45s"/><circle class="twinkle" cx="1060" cy="13" r="1.6" fill="#ffcab0" style="animation-delay:-2.58s"/><circle class="twinkle" cx="110" cy="196.1" r="1.6" fill="#ffcab0" style="animation-delay:-4.2s"/><circle class="twinkle" cx="330" cy="196.8" r="1.1" fill="#ffcab0" style="animation-delay:-1.13s"/><circle class="twinkle" cx="550" cy="196.4" r="1.1" fill="#ffcab0" style="animation-delay:-2.26s"/><circle class="twinkle" cx="770" cy="196" r="1.6" fill="#ffcab0" style="animation-delay:-3.39s"/><circle class="twinkle" cx="990" cy="196.7" r="1.1" fill="#ffcab0" style="animation-delay:-0.32s"/></g><rect x="23" y="66" width="10" height="122" rx="5.0" fill="#00c8b8" opacity=".28" filter="url(#soft)" class="pulse"/><g clip-path="url(#spc)"><rect x="26" y="66" width="4" height="122" rx="2.0" fill="url(#spineg)"/><rect class="spimp" x="26" y="66" width="4" height="34" rx="2.0" fill="#ffffff" fill-opacity=".85" style="--spine-h:122;filter:url(#soft)"/><rect class="spimp" x="26" y="66" width="4" height="34" rx="2.0" fill="#ff9f6e" fill-opacity=".8" style="--spine-h:122;animation-delay:2.6s;filter:url(#soft)"/></g>

<g class="drift-c"><ellipse cx="903" cy="110" rx="178" ry="140" fill="url(#au-03)" class="mesh"/></g>
<rect x="0" y="0" width="1100" height="58" fill="#ffffff" opacity=".018"/>
<g class="enter">
<text x="74" y="58" font-size="11.5" fill="#00c8b8" font-weight="600" class="mono" letter-spacing="2.6">03 / AI × ROUTING</text>
<text x="74" y="102" font-size="38" fill="#f3f5f9" font-weight="700" letter-spacing="-0.9">PrimeRouter &amp; CLI</text>
<text x="74" y="134" font-size="17" fill="#8b95ab">Маршрутизация LLM-провайдеров и собственный CLI.</text>
<rect x="52" y="166" width="57.68" height="25" rx="12.5" fill="#0b1018" fill-opacity="0.88" stroke="#00c8b8" stroke-opacity="0.42"/><text x="74" y="182.64" font-size="11.5" fill="#00c8b8" font-weight="400" class="mono" letter-spacing="0.4" textLength="13.68" lengthAdjust="spacing">GO</text><rect x="117.68" y="166" width="71.36" height="25" rx="12.5" fill="#0b1018" fill-opacity="0.88" stroke="#00c8b8" stroke-opacity="0.42"/><text x="139.68" y="182.64" font-size="11.5" fill="#00c8b8" font-weight="400" class="mono" letter-spacing="0.4" textLength="27.36" lengthAdjust="spacing">RUST</text><rect x="197.04" y="166" width="119.24" height="25" rx="12.5" fill="#0b1018" fill-opacity="0.88" stroke="#00c8b8" stroke-opacity="0.42"/><text x="219.04" y="182.64" font-size="11.5" fill="#00c8b8" font-weight="400" class="mono" letter-spacing="0.4" textLength="75.24" lengthAdjust="spacing">SPHEREPRIME</text>
</g>
<path d="M706 44V191" stroke="#1b2333"/>
<g class="enter" style="animation-delay:.16s"><path d="M822 112C922 112 955 68 1001 68" fill="none" stroke="#00c8b8" stroke-opacity=".16" stroke-width="2.4"/><path d="M822 112C922 112 955 68 1001 68" fill="none" stroke="#00c8b8" stroke-width="2.4" class="flow" style="animation-delay:0s"/><circle class="pulse" cx="1010" cy="68" r="13" fill="none" stroke="#00c8b8" stroke-width="1.2" stroke-opacity=".5" style="animation-delay:0s"/><circle cx="1010" cy="68" r="10" fill="#00c8b8" opacity=".14"/><circle cx="1010" cy="68" r="10" fill="none" stroke="#00c8b8" stroke-opacity=".7"/><circle cx="1010" cy="68" r="3" fill="#00c8b8"/><path d="M822 112C922 112 955 112 1001 112" fill="none" stroke="#6ef0dd" stroke-opacity=".16" stroke-width="2.4"/><path d="M822 112C922 112 955 112 1001 112" fill="none" stroke="#6ef0dd" stroke-width="2.4" class="flow" style="animation-delay:-0.62s"/><circle class="pulse" cx="1010" cy="112" r="13" fill="none" stroke="#6ef0dd" stroke-width="1.2" stroke-opacity=".5" style="animation-delay:-0.4s"/><circle cx="1010" cy="112" r="10" fill="#6ef0dd" opacity=".14"/><circle cx="1010" cy="112" r="10" fill="none" stroke="#6ef0dd" stroke-opacity=".7"/><circle cx="1010" cy="112" r="3" fill="#6ef0dd"/><path d="M822 112C922 112 955 156 1001 156" fill="none" stroke="#8b6dff" stroke-opacity=".16" stroke-width="2.4"/><path d="M822 112C922 112 955 156 1001 156" fill="none" stroke="#8b6dff" stroke-width="2.4" class="flow" style="animation-delay:-1.24s"/><circle class="pulse" cx="1010" cy="156" r="13" fill="none" stroke="#8b6dff" stroke-width="1.2" stroke-opacity=".5" style="animation-delay:-0.8s"/><circle cx="1010" cy="156" r="10" fill="#8b6dff" opacity=".14"/><circle cx="1010" cy="156" r="10" fill="none" stroke="#8b6dff" stroke-opacity=".7"/><circle cx="1010" cy="156" r="3" fill="#8b6dff"/><path class="packet" d="M822 112C922 112 955 68 1001 68" stroke="#00c8b8" stroke-width="4.6" stroke-opacity="0.95" stroke-dasharray=".1 185.933" style="--len:185.933;animation-delay:0s;animation-duration:2.8s"/><path class="packet" d="M822 112C922 112 955 112 1001 112" stroke="#6ef0dd" stroke-width="4.6" stroke-opacity="0.95" stroke-dasharray=".1 179" style="--len:179;animation-delay:-0.9s;animation-duration:2.8s"/><path class="packet" d="M822 112C922 112 955 156 1001 156" stroke="#8b6dff" stroke-width="4.6" stroke-opacity="0.95" stroke-dasharray=".1 185.933" style="--len:185.933;animation-delay:-1.8s;animation-duration:2.8s"/><circle cx="800" cy="112" r="30" fill="none" stroke="#6ef0dd" stroke-opacity=".3" stroke-dasharray="2 9" class="spin-rev" style="animation-duration:20s"/><circle class="mesh" cx="800" cy="112" r="21" fill="#00c8b8" opacity=".18" filter="url(#soft)"/><circle cx="800" cy="112" r="19" fill="url(#panel)" stroke="#6ef0dd" stroke-opacity=".8"/><circle class="pulse" cx="800" cy="112" r="8" fill="#00c8b8"/></g>
