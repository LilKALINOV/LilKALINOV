<defs>
 <clipPath id="clip"><rect width="1100" height="430" rx="6"/></clipPath>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 .5H2M.5 0V2" stroke="#ecebe5" stroke-opacity=".14"/></pattern>
 
