<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="150" viewBox="0 0 1100 150" role="img" aria-labelledby="t">
<title id="t">01 — SpherePrime. Агентные инструменты для разработчиков: терминал, десктоп, роутинг, прокси.</title>
<defs>
 <clipPath id="clip"><rect width="1100" height="150" rx="6"/></clipPath>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 .5H2M.5 0V2" stroke="#ecebe5" stroke-opacity=".14"/></pattern>
 
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif}
.mono{font-family:'Cascadia Mono','JetBrains Mono',Consolas,'SF Mono',Menlo,'Courier New',monospace}
.fb{transform-box:fill-box;transform-origin:center}
.fbl{transform-box:fill-box;transform-origin:left center}
.fbb{transform-box:fill-box;transform-origin:center bottom}
.pivot{transform-box:view-box;transform-origin:0 0}

@keyframes reveal{from{transform:translateY(105%)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes marquee{to{transform:translateX(var(--shift))}}
@keyframes flicker{0%,100%{opacity:.12}40%{opacity:.12}42%{opacity:1}78%{opacity:1}80%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ripple{0%{transform:scale(.7);opacity:0}15%{opacity:.6}100%{transform:scale(1.8);opacity:0}}
@keyframes register{0%{transform:translateX(0)}100%{transform:translateX(var(--run))}}

.reveal{animation:reveal 1.1s cubic-bezier(.77,0,.18,1) both}
.rise{animation:rise .9s cubic-bezier(.19,1,.22,1) both}
.fade{animation:fade 1.2s ease both}
.blink{animation:blink 1.1s steps(1,end) infinite}
.eq{animation:eq 1.5s cubic-bezier(.45,0,.55,1) infinite}
.draw{stroke-dasharray:100;animation:draw 1.8s cubic-bezier(.65,0,.35,1) both}
.grow{animation:grow 1.4s cubic-bezier(.77,0,.18,1) both}
.flicker{animation:flicker 7s steps(1,end) infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.spin{animation:spin 40s linear infinite}
.ripple{animation:ripple 3.4s cubic-bezier(.2,.6,.3,1) infinite}
.register{animation:register 10s cubic-bezier(.77,0,.18,1) infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes bob{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}.bob{animation:bob 2.2s ease-in-out infinite}</style>
<rect width="1100" height="150" rx="6" fill="#121211"/><path d="M12 22V12H22M12 128V138H22M1088 22V12H1078M1088 128V138H1078" fill="none" stroke="#57554f" stroke-width="1.2"/><path d="M28 50H1072" stroke="#2d2c29"/><g style="--run:988px"><rect class="register" style="animation-delay:-5.20s" x="28" y="49" width="56" height="2" fill="#ff5b14"/></g><text x="28.0" y="36.0" font-size="11" fill="#8d8b85" font-weight="600" letter-spacing="1.6" class="mono">РАЗДЕЛ 01</text><text x="1072.0" y="36.0" font-size="11" fill="#8d8b85" font-weight="600" text-anchor="end" letter-spacing="1.6" class="mono">04 ПРОЕКТА</text><rect x=".5" y=".5" width="1099" height="149" rx="6" fill="none" stroke="#2d2c29"/><clipPath id="num"><rect x="20" y="58" width="150" height="86"/></clipPath><g clip-path="url(#num)"><g class="reveal"><text x="24.0" y="130.0" font-size="92" fill="#ff5b14" font-weight="800" letter-spacing="-4">01</text></g></g><clipPath id="ttl"><rect x="170" y="62" width="900" height="56"/></clipPath><g clip-path="url(#ttl)"><g class="reveal" style="animation-delay:0.15s"><text x="176.0" y="106.0" font-size="46" fill="#ecebe5" font-weight="800" letter-spacing="-1.5">SpherePrime</text></g></g><g class="rise" style="animation-delay:0.50s"><text x="178.0" y="132.0" font-size="15" fill="#8d8b85">Агентные инструменты для разработчиков: терминал, десктоп, роутинг, прокси.</text></g><path d="M168 70V130" stroke="#2d2c29"/><g transform="translate(1056 104)"><g class="bob"><path d="M0 -14V12M-8 4L0 12L8 4" fill="none" stroke="#ecebe5" stroke-width="1.8"/></g></g><text x="1036.0" y="109.0" font-size="11" fill="#8d8b85" font-weight="600" text-anchor="end" letter-spacing="1.6" class="mono">ЛИСТАЙ</text>
</svg>