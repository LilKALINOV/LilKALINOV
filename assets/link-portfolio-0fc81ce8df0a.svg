<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="356" height="92" viewBox="0 0 356 92" role="img" aria-labelledby="t">
<title id="t">Портфолио — lilkalinov.github.io/portfolio</title>
<defs>
 <clipPath id="clip"><rect width="356" height="92" rx="6"/></clipPath>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 .5H2M.5 0V2" stroke="#ecebe5" stroke-opacity=".14"/></pattern>
 
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif}
.mono{font-family:'Cascadia Mono','JetBrains Mono',Consolas,'SF Mono',Menlo,'Courier New',monospace}
.fb{transform-box:fill-box;transform-origin:center}
.fbl{transform-box:fill-box;transform-origin:left center}
.fbb{transform-box:fill-box;transform-origin:center bottom}
.pivot{transform-box:view-box;transform-origin:0 0}

@keyframes reveal{from{transform:translateY(105%)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes marquee{to{transform:translateX(var(--shift))}}
@keyframes flicker{0%,100%{opacity:.12}40%{opacity:.12}42%{opacity:1}78%{opacity:1}80%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ripple{0%{transform:scale(.7);opacity:0}15%{opacity:.6}100%{transform:scale(1.8);opacity:0}}
@keyframes register{0%{transform:translateX(0)}100%{transform:translateX(var(--run))}}

.reveal{animation:reveal 1.1s cubic-bezier(.77,0,.18,1) both}
.rise{animation:rise .9s cubic-bezier(.19,1,.22,1) both}
.fade{animation:fade 1.2s ease both}
.blink{animation:blink 1.1s steps(1,end) infinite}
.eq{animation:eq 1.5s cubic-bezier(.45,0,.55,1) infinite}
.draw{stroke-dasharray:100;animation:draw 1.8s cubic-bezier(.65,0,.35,1) both}
.grow{animation:grow 1.4s cubic-bezier(.77,0,.18,1) both}
.flicker{animation:flicker 7s steps(1,end) infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.spin{animation:spin 40s linear infinite}
.ripple{animation:ripple 3.4s cubic-bezier(.2,.6,.3,1) infinite}
.register{animation:register 10s cubic-bezier(.77,0,.18,1) infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes nudge{0%,70%,100%{transform:translate(0,0)}80%{transform:translate(4px,-4px)}}.nudge{animation:nudge 3.6s ease-in-out infinite}</style>
<rect width="356" height="92" rx="6" fill="#121211"/><path d="M12 22V12H22M12 70V80H22M344 22V12H334M344 70V80H334" fill="none" stroke="#57554f" stroke-width="1.2"/><rect x=".5" y=".5" width="355" height="91" rx="6" fill="none" stroke="#2d2c29"/><text x="24.0" y="30.0" font-size="11" fill="#ff5b14" font-weight="600" letter-spacing="1.6" class="mono">03</text><text x="24.0" y="58.0" font-size="22" fill="#ecebe5" font-weight="700">Портфолио</text><rect class="fbl grow" style="animation-delay:0.90s" x="24" y="66" width="127" height="2" fill="#ff5b14"/><text x="24.0" y="82.0" font-size="11.5" fill="#8d8b85" class="mono">lilkalinov.github.io/portfolio</text><g transform="translate(320 46.0)"><g class="nudge" style="animation-delay:0.50s"><path d="M-9 9L9 -9M-3.6 -9H9V3.6" fill="none" stroke="#ecebe5" stroke-width="1.8" stroke-linecap="square"/></g></g>
</svg>