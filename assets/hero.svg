<rect x="757.64" y="337.15" width="220.72" height="22" rx="11" fill="#080d15" fill-opacity="0.94"/><text x="868" y="352" font-size="11" fill="#7e8899" class="mono" text-anchor="middle" letter-spacing="2.6" textLength="192.72" lengthAdjust="spacing">SPHEREPRIME · IN ORBIT</text>
