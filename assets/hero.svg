<g transform="rotate(-24 868 236)"><g class="spin"><ellipse cx="868" cy="236" rx="170" ry="71" fill="none" stroke="#ff9f6e" stroke-opacity=".22" stroke-width="1.4"/><ellipse cx="868" cy="236" rx="170" ry="71" fill="none" stroke="#ff9f6e" stroke-opacity=".85" stroke-width="2" class="dash" style="animation-duration:11s"/><circle cx="1038" cy="236" r="3.4" fill="#ff9f6e"/></g></g><g transform="rotate(20 868 236)"><g class="spin-rev"><ellipse cx="868" cy="236" rx="148" ry="61" fill="none" stroke="#8b6dff" stroke-opacity=".22" stroke-width="1.4"/><ellipse cx="868" cy="236" rx="148" ry="61" fill="none" stroke="#8b6dff" stroke-opacity=".85" stroke-width="2" class="dash" style="animation-duration:11s"/><circle cx="1016" cy="236" r="3.4" fill="#8b6dff"/></g></g>
<circle class="mesh" cx="868" cy="236" r="60" fill="#ff6a3d" opacity=".3" filter="url(#softer)"/>
<circle class="ripple" cx="868" cy="236" r="58" fill="none" stroke="#ff9f6e" stroke-width="1.5" style="animation-delay:0s"/><circle class="ripple" cx="868" cy="236" r="58" fill="none" stroke="#ff9f6e" stroke-width="1.5" style="animation-delay:1.2s"/><circle class="ripple" cx="868" cy="236" r="58" fill="none" stroke="#ff9f6e" stroke-width="1.5" style="animation-delay:2.4s"/>
<path class="morph" d="M926 236C926 268.033 900.033 294 868 294C835.967 294 810 268.033 810 236C810 203.967 835.967 178 868 178C900.033 178 926 203.967 926 236Z" fill="url(#panel)"/>
<path class="morph" d="M926 236C926 268.033 900.033 294 868 294C835.967 294 810 268.033 810 236C810 203.967 835.967 178 868 178C900.033 178 926 203.967 926 236Z" fill="none" stroke="url(#brandx)" stroke-opacity=".75" stroke-width="1.6"/>
