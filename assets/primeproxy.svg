ay:-0.62s;animation-duration:3.1s"/><path class="packet" d="M848 104.667C876 90,930 134,958 119.333" stroke="#ff9f6e" stroke-width="4.4" stroke-opacity="0.9" stroke-dasharray=".1 113.906" style="--len:113.906;animation-delay:-1.24s;animation-duration:3.1s"/></g>
